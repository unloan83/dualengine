name: Dual-Engine Trading Bot

on:
  schedule:
    - cron: '30 4 * * 1-5'    # 10:00 AM IST Daily Entry Scan
    - cron: '40 9 * * 1-5'    # 03:10 PM IST Daily Close Review
  workflow_dispatch:
    inputs:
      velocity:
        description: 'Price Velocity'
        default: '1.0'
      atr_mult:
        description: 'ATR Mult'
        default: '0.5'

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Core Dependencies Install
        run: pip install requests pandas

      - name: Execute Model Core Script
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          INPUT_VELOCITY: ${{ github.event.inputs.velocity }}
          INPUT_ATR_MULT: ${{ github.event.inputs.atr_mult }}
        run: |
          # 📌 FIXED: Explicit routing logic using clean text checking flags
          if [ "${{ github.event.schedule }}" = "40 9 * * 1-5" ]; then
            python bot.py squareoff
          else
            python bot.py scan
          fi

      - name: Safe Data Stream Sync Only
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          if [ -f paper_trade_log.csv ]; then
            git add paper_trade_log.csv
            git diff --quiet && git diff --staged --quiet || (git commit -m "📈 update data logs [skip ci]" && git push)
          fi
