name: Dual-Engine Trading Bot
on:
  schedule:
    - cron: '30 4 * * 1-5'    # 10:00 AM IST Daily Entry Scan
    - cron: '40 9 * * 1-5'    # 03:10 PM IST Daily Monitor/Exit Check
  workflow_dispatch:
    inputs:
      velocity:
        description: 'Price Velocity'
        default: '1.0'
      atr_mult:
        description: 'ATR Mult'
        default: '0.5'
jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Core Dependencies Install
        run: pip install requests pandas

      - name: Execute Model Core Script
        id: run_engine
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          INPUT_VELOCITY: ${{ github.event.inputs.velocity }}
          INPUT_ATR_MULT: ${{ github.event.inputs.atr_mult }}
        run: |
          set +e
          if [ "${{ github.event.schedule }}" = "40 9 * * 1-5" ]; then
            MODE="monitor"
          else
            MODE="scan"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          python dualengine.py "$MODE" 2>&1 | tee run_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Sync Trade Log Back to Repo
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          if [ -f paper_trade_log.csv ]; then
            git add paper_trade_log.csv
            git diff --quiet && git diff --staged --quiet || (git commit -m "update data logs [skip ci]" && git push)
          fi

      - name: Notify Telegram — Success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ steps.run_engine.outputs.mode }}"
          TAIL=$(tail -n 15 run_output.log | sed 's/"/\\"/g')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="✅ DualEngine [$MODE] completed OK.

          $TAIL"

      - name: Notify Telegram — Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ steps.run_engine.outputs.mode }}"
          TAIL=$(tail -n 30 run_output.log 2>/dev/null | sed 's/"/\\"/g')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="❌ DualEngine [$MODE] FAILED — check GitHub Actions logs.

          $TAIL"
