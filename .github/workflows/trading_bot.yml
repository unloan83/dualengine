name: Dual-Engine Trading Bot

on:
  schedule:
    # 10:00 AM IST (04:30 AM UTC) - Morning Scan
    - cron: '30 4 * * 1-5'
    # 03:10 PM IST (09:40 AM UTC) - Square-off
    - cron: '40 9 * * 1-5'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }} 
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas

      - name: Run Morning Scan
        if: github.event.schedule == '30 4 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python bot.py scan

      - name: Run Evening Square-Off
        if: github.event.schedule == '40 9 * * 1-5'
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python bot.py squareoff

      - name: Commit and Push Trading Logs
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          # Only commit if changes were written to the CSV file
          if [ -f paper_trade_log.csv ]; then
            git add paper_trade_log.csv
            git diff --quiet && git diff --staged --quiet || (git commit -m "📈 Auto-update paper trade logs [skip ci]" && git push)
          fi
