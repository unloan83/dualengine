name: Dual-Engine Trading Bot

on:
  schedule:
    # Runs Monday to Friday at 04:30 AM UTC (10:00 AM IST) - Morning Scan & Entry
    - cron: '30 4 * * 1-5'
    # Runs Monday to Friday at 09:40 AM UTC (03:10 PM IST) - Evening Square-off
    - cron: '40 9 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger it anytime for testing

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-node-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas

      - name: Run Morning Scan
        if: github.event.schedule == '30 4 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python bot.py scan

      - name: Run Evening Square-Off
        if: github.event.schedule == '40 9 * * 1-5'
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python bot.py squareoff
